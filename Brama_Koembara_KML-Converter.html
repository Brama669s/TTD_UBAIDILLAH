<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KML to Excel Converter - Precision</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/togeojson/0.16.0/togeojson.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-white rounded-xl shadow-lg p-8">
        <div class="text-center mb-8">
            <h1 class="text-2xl font-bold text-gray-800">KML to Excel</h1>
            <p class="text-gray-500 text-sm">Cordinate Converter By Brama Koembara</p>
        </div>

        <div id="drop-zone" class="border-2 border-dashed border-blue-400 rounded-lg p-10 text-center cursor-pointer hover:bg-blue-50 transition">
            <input type="file" id="fileInput" accept=".kml" class="hidden">
            <div class="text-blue-500 mb-4">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12 mx-auto" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" />
                </svg>
            </div>
            <p class="text-sm text-gray-600">Klik atau seret file <b>.KML</b> Anda ke sini</p>
        </div>

        <div id="status-area" class="mt-6 hidden">
            <div class="flex items-center justify-between bg-green-50 p-4 rounded-lg border border-green-200">
                <span id="file-name" class="text-sm text-green-700 font-medium truncate w-40">file.kml</span>
                <button id="downloadBtn" class="bg-green-600 hover:bg-green-700 text-white text-sm px-4 py-2 rounded shadow transition">
                    Download Excel
                </button>
            </div>
        </div>

        <div class="mt-8 text-xs text-center text-gray-400">
            Format: Lat (9 digit) | Lon (10 digit)
        </div>
    </div>

    <script>
        const fileInput = document.getElementById('fileInput');
        const dropZone = document.getElementById('drop-zone');
        const statusArea = document.getElementById('status-area');
        const fileNameLabel = document.getElementById('file-name');
        const downloadBtn = document.getElementById('downloadBtn');

        let resultData = [];

        // Event Klik Area
        dropZone.onclick = () => fileInput.click();

        // Handle File yang dipilih
        fileInput.onchange = (e) => {
            const file = e.target.files[0];
            if (file) processKML(file);
        };

        function processKML(file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const parser = new DOMParser();
                const kmlDoc = parser.parseFromString(e.target.result, "text/xml");
                const geoJson = toGeoJSON.kml(kmlDoc);

                const dataList = [];

                geoJson.features.forEach(feature => {
                    if (feature.geometry && feature.geometry.type === 'Point') {
                        const name = feature.properties.name || "Tanpa Nama";
                        const lon = feature.geometry.coordinates[0];
                        const lat = feature.geometry.coordinates[1];

                        // LOGIKA PRESISI DIGIT
                        // toFixed(n) akan memastikan jumlah digit di belakang koma
                        dataList.push({
                            "Nama": name,
                            "Latitude": parseFloat(lat.toFixed(9)),
                            "Longitude": parseFloat(lon.toFixed(10))
                        });
                    }
                });

                if (dataList.length > 0) {
                    resultData = dataList;
                    fileNameLabel.innerText = file.name;
                    statusArea.classList.remove('hidden');
                } else {
                    alert("KML tidak berisi data koordinat Point!");
                }
            };
            reader.readAsText(file);
        }

        // Fungsi Download Excel
        downloadBtn.onclick = () => {
            const ws = XLSX.utils.json_to_sheet(resultData);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Koordinat");
            CSV.utils.book_append_sheet(wb, ws, "Koordinat");
            
            // Simpan file
            XLSX.writeFile(wb, "hasil_konversi_presisi.xlsx");
            CSV.writeFile(wb, "hasil_konversi_presisi.xlsx");
        };

        // Drag & Drop Handling
        dropZone.ondragover = (e) => { e.preventDefault(); dropZone.classList.add('bg-blue-50'); };
        dropZone.ondragleave = () => dropZone.classList.remove('bg-blue-50');
        dropZone.ondrop = (e) => {
            e.preventDefault();
            const file = e.dataTransfer.files[0];
            if (file && file.name.endsWith('.kml')) processKML(file);
        };
    </script>
</body>
</html>
